<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="DM Sans, Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7a7a"/>
    </marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#1b1b1b"/>

  <!-- caption -->
  <circle cx="44" cy="46" r="4" fill="#d6c9a9"/>
  <text x="60" y="51" fill="#b5b5b5" font-size="15" letter-spacing="3">GOVERNED LAKEHOUSE / MEDALLION + RAG</text>

  <!-- column labels -->
  <g fill="#8a8a8a" font-size="13" letter-spacing="2.4">
    <text x="60" y="118">INGESTION</text>
    <text x="400" y="118">DELTA LAKE ZONES</text>
    <text x="840" y="118">SERVING</text>
  </g>

  <!-- ingestion boxes -->
  <g font-size="17" fill="#e3e3e3">
    <rect x="60" y="150" width="240" height="78" rx="4" fill="url(#g)" stroke="#3a3a3a"/>
    <text x="80" y="183">Bring-your-own-data</text>
    <text x="80" y="208" fill="#8f8f8f" font-size="14">landing/ · scanned on arrival</text>

    <rect x="60" y="260" width="240" height="78" rx="4" fill="url(#g)" stroke="#3a3a3a"/>
    <text x="80" y="293">Periodic pull</text>
    <text x="80" y="318" fill="#8f8f8f" font-size="14">mock_sources/ · scheduled</text>

    <rect x="60" y="370" width="240" height="78" rx="4" fill="url(#g)" stroke="#3a3a3a"/>
    <text x="80" y="403">File delivery</text>
    <text x="80" y="428" fill="#8f8f8f" font-size="14">incoming/ · batch drops</text>
  </g>

  <!-- arrows ingestion -> bronze -->
  <g stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M300 189 C 350 189, 350 299, 398 299"/>
    <path d="M300 299 L 398 299"/>
    <path d="M300 409 C 350 409, 350 299, 398 299"/>
  </g>

  <!-- zones -->
  <g font-size="17" fill="#e3e3e3">
    <rect x="400" y="150" width="400" height="300" rx="6" fill="#171717" stroke="#333"/>
    <text x="420" y="178" fill="#8a8a8a" font-size="12" letter-spacing="2">52 TABLES · TABLE-OWNERSHIP ACL · LINEAGE</text>

    <rect x="420" y="262" width="110" height="74" rx="4" fill="#3a3024" stroke="#6b5a3e"/>
    <text x="446" y="294" fill="#e8dcc0" font-weight="500">Bronze</text>
    <text x="434" y="318" fill="#b9ab8e" font-size="13">raw + lineage</text>

    <rect x="545" y="262" width="110" height="74" rx="4" fill="#2f3236" stroke="#5a6068"/>
    <text x="578" y="294" fill="#e0e4ea" font-weight="500">Silver</text>
    <text x="555" y="318" fill="#a8afb8" font-size="13">cleaned / typed</text>

    <rect x="670" y="262" width="110" height="74" rx="4" fill="#3b3520" stroke="#7a6a2e"/>
    <text x="707" y="294" fill="#efe3b0" font-weight="500">Gold</text>
    <text x="693" y="318" fill="#c9bb84" font-size="13">aggregates</text>

    <g stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M530 299 L 543 299"/>
      <path d="M655 299 L 668 299"/>
    </g>

    <!-- governance band -->
    <rect x="420" y="372" width="360" height="58" rx="4" fill="#1f1f1f" stroke="#3a3a3a" stroke-dasharray="4 4"/>
    <text x="440" y="396" fill="#cfcfcf" font-size="14">Governance: owners per table, schema permissions, zone policy</text>
    <text x="440" y="417" fill="#8f8f8f" font-size="13">Delta Lake · PySpark · Spark SQL · synthetic data only</text>
  </g>

  <!-- arrows zones -> serving -->
  <g stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M800 230 C 840 230, 840 189, 878 189"/>
    <path d="M800 299 L 878 299"/>
    <path d="M800 370 C 840 370, 840 409, 878 409"/>
  </g>

  <!-- serving boxes -->
  <g font-size="17" fill="#e3e3e3">
    <rect x="880" y="150" width="260" height="78" rx="4" fill="url(#g)" stroke="#3a3a3a"/>
    <text x="900" y="183">SQL warehouse</text>
    <text x="900" y="208" fill="#8f8f8f" font-size="14">analyst queries on silver + gold</text>

    <rect x="880" y="260" width="260" height="78" rx="4" fill="#23271f" stroke="#55613f"/>
    <text x="900" y="293" fill="#dfe8cf">Semantic search + RAG</text>
    <text x="900" y="318" fill="#a4b38f" font-size="14">plain-English → governed tables</text>

    <rect x="880" y="370" width="260" height="78" rx="4" fill="url(#g)" stroke="#3a3a3a"/>
    <text x="900" y="403">Job cluster</text>
    <text x="900" y="428" fill="#8f8f8f" font-size="14">builds silver + gold on schedule</text>
  </g>

  <!-- RAG detail strip -->
  <g>
    <rect x="60" y="500" width="1080" height="140" rx="6" fill="#171717" stroke="#333"/>
    <text x="84" y="530" fill="#8a8a8a" font-size="12" letter-spacing="2">HOW A QUESTION BECOMES AN ANSWER</text>
    <g font-size="15" fill="#d8d8d8">
      <rect x="84" y="552" width="190" height="60" rx="4" fill="#202020" stroke="#3a3a3a"/>
      <text x="100" y="578">“Which facilities had</text><text x="100" y="598">late submissions?”</text>

      <rect x="330" y="552" width="190" height="60" rx="4" fill="#202020" stroke="#3a3a3a"/>
      <text x="346" y="578">Catalog embeddings</text><text x="346" y="598" fill="#8f8f8f" font-size="13">sentence-transformers</text>

      <rect x="576" y="552" width="190" height="60" rx="4" fill="#202020" stroke="#3a3a3a"/>
      <text x="592" y="578">FAISS lookup</text><text x="592" y="598" fill="#8f8f8f" font-size="13">nearest governed tables</text>

      <rect x="822" y="552" width="294" height="60" rx="4" fill="#23271f" stroke="#55613f"/>
      <text x="838" y="578" fill="#dfe8cf">Grounded answer + SQL</text><text x="838" y="598" fill="#a4b38f" font-size="13">respecting table ownership</text>
    </g>
    <g stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M274 582 L 328 582"/>
      <path d="M520 582 L 574 582"/>
      <path d="M766 582 L 820 582"/>
    </g>
  </g>
</svg>
